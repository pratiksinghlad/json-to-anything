[package]
name = "json-engine"
version = "0.1.0"
edition = "2021"
description = "WASM-accelerated JSON engine for the json-to-anything conversion library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[profile.release]
opt-level = "z"     # Optimise for size
lto = true
codegen-units = 1
panic = "abort"
